# Genre Profile: Chicago Blues
# References:
#   - 12-bar blues form and dominant 7th harmony (Titon, 1994)
#   - Blue notes: b3, b5, b7 over major tonality (Jaffe, 2011)
#   - Chicago blues electric band instrumentation (Rowe, 1975)
#   - Shuffle rhythm and triplet feel in blues (Evans, 1982)

