# Genre Profile: Classic Funk
# References:
#   - Funk rhythmic theory: "The One" and 16th-note grid (Stewart, 2000)
#   - Syncopated bass paradigms in funk (Danielsen, 2006)
#   - Dominant 7th/9th chord usage in funk harmony (Vincent, 1996)
#   - Polyrhythmic layering and interlocking parts (Pressing, 2002)

