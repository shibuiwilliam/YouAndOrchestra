# Genre Profile: House Music
# References:
#   - Four-on-the-floor kick pattern as house foundation (Butler, 2006)
#   - Repetitive harmonic vamps and modal progressions (Hawkins, 2003)
#   - Sidechain compression and pumping dynamics (Snoman, 2014)
#   - Build-and-release formal structures in EDM (Solberg, 2014)

name: electronic_house

chord_palette:
  - i
  - bVI
  - bVII
  - iv
  - bIII
  - v
  - I
  - IV

progression_n_grams:
  "i,bVI": 0.18
  "bVI,bVII": 0.16
  "bVII,i": 0.14
  "i,iv": 0.12
  "iv,bVI": 0.10
  "i,bVII": 0.08
  "bIII,bVI": 0.07
  "bVI,iv": 0.08
  "i,bIII": 0.07

seventh_chord_probability: 0.20
secondary_dominant_probability: 0.03
modal_interchange_probability: 0.15

melodic_contour_weights:
  ascending: 0.25
  descending: 0.20
  arch: 0.30
  valley: 0.15
  flat: 0.10

leap_probability: 0.20
blue_note_probability: 0.02

swing_ratio: 0.5
syncopation_density: 0.30

rhythm_template_weights:
  eighth_notes: 0.30
  sixteenth_notes: 0.30
  quarter_notes: 0.20
  dotted_eighth: 0.10
  half_notes: 0.10

preferred_instruments:
  - synth_lead
  - synth_pad
  - synth_bass
  - drum_kit

voicing_density_target: 3
bass_motion_style: root_fifth

typical_dynamics_range: [mp, f]
target_spectral_centroid: 0.55
tempo_range: [120, 130]
