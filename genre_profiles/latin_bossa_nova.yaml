# Genre Profile: Bossa Nova
# References:
#   - Bossa nova harmony: jazz-influenced with Brazilian sensibility (Castro, 2000)
#   - Nylon guitar patterns and syncopated bass (Jobim & Chediak, 1990)
#   - Gentle syncopation and the bossa clave (Galm, 2010)
#   - Extended chords and chromatic voice leading (Rawlins & Bahha, 2005)

