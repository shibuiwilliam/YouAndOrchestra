# Genre Profile: Classic Rock
# References:
#   - Pentatonic-based melodic vocabulary in blues-rock (Covach, 2006)
#   - Power chord and riff-based harmonic language (Moore, 2001)
#   - Backbeat drumming and straight-eighth feel (Zbikowski, 2004)
#   - Song form: verse-chorus with guitar solo (Everett, 2009)

name: rock_classic

chord_palette:
  - I
  - IV
  - V
  - vi
  - bVII
  - ii
  - bIII
  - bVI

progression_n_grams:
  "I,IV": 0.18
  "IV,V": 0.14
  "V,I": 0.15
  "I,bVII": 0.12
  "bVII,IV": 0.10
  "I,V": 0.10
  "vi,IV": 0.08
  "IV,I": 0.07
  "I,bIII": 0.06

seventh_chord_probability: 0.15
secondary_dominant_probability: 0.08
modal_interchange_probability: 0.20

