name: bossa_nova
parent: jazz
description: |
  Bossa Nova: Brazilian fusion of cool jazz harmony and samba rhythm.
  Gentle syncopation, nylon-string guitar, understated vocals,
  sophisticated extended chords. Tom Jobim, Joao Gilberto lineage.
  Quieter and more intimate than samba, with jazz-level harmonic complexity.

typical_tempo_range: [100, 140]
typical_keys: ["C", "F", "Db", "Ab", "G", "D"]
typical_modes: ["major", "minor", "lydian", "dorian"]
typical_time_signatures: ["4/4", "2/4"]
typical_form_templates: ["aaba_32", "verse_chorus_bridge", "through_composed"]
typical_duration_seconds: [180, 300]

core_instruments:
  - name: nylon_guitar
    role: harmony
  - name: upright_bass
    role: bass
  - name: drums_bossa_kit
    role: rhythm
optional_instruments:
  - name: piano_acoustic
    role: harmony
  - name: flute
    role: melody
  - name: tenor_sax
    role: melody
  - name: alto_sax
    role: melody
  - name: vibraphone
    role: melody
  - name: shaker
    role: rhythm
forbidden_instruments:
  - distorted_electric_guitar
  - synth_lead_saw
  - drums_808
  - heavy_distortion_bass

