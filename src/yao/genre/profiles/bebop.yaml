name: bebop
parent: jazz
description: |
  Bebop: virtuosic, fast-tempo jazz with complex harmonic substitutions,
  chromatic passing tones, and intricate melodic lines.
  Charlie Parker, Dizzy Gillespie, Bud Powell lineage.
  Emphasis on improvisation over rapidly moving changes, enclosures,
  and bebop scales. Faster and more harmonically dense than swing-era jazz.

typical_tempo_range: [160, 320]
typical_keys: ["F", "Bb", "Eb", "Ab", "Db", "C", "G"]
typical_modes: ["major", "minor", "dorian", "mixolydian"]
typical_time_signatures: ["4/4"]
typical_form_templates: ["aaba_32", "rhythm_changes", "blues_12_bar"]
typical_duration_seconds: [180, 420]

core_instruments:
  - name: upright_bass
    role: bass
  - name: drums_jazz_kit
    role: rhythm
  - name: piano_acoustic
    role: harmony
optional_instruments:
  - name: alto_sax
    role: melody
  - name: tenor_sax
    role: melody
  - name: trumpet
    role: melody
  - name: trombone
    role: melody
  - name: vibraphone
    role: melody
forbidden_instruments:
  - distorted_electric_guitar
  - synth_lead_saw
  - synth_bass
  - drums_808

chord_palette_extended:
  - maj7
  - min7
  - dom7
  - m7b5
  - dim7
  - alt
  - "13"
  - "9"
  - "#11"
  - "7b9"
  - "7#9"
  - aug7
  - "6"
  - m6
progression_library_ids:
  - jazz_ii_V_I
  - rhythm_changes_a
  - rhythm_changes_b
  - bird_blues
  - bebop_turnaround
harmonic_rhythm: [0.5, 2.0]
modal_interchange_allowed: true
chromaticism_level: 0.7
seventh_chord_probability: 0.95
secondary_dominant_probability: 0.45
modal_interchange_probability: 0.2
tritone_substitution_probability: 0.3

swing_8th: 0.67
swing_16th: 0.55
typical_grooves:
  - jazz_swing_fast
  - jazz_swing_uptempo
  - jazz_medium_swing
drum_kit_preference: jazz_kit
drum_pattern_ids:
  - jazz_ride_swing
  - jazz_uptempo_ride
  - jazz_bombs
syncopation_density: 0.5
polyrhythm_tolerance: 0.35

melodic_devices:
  - bebop_scale
  - enclosure
  - chromatic_passing
  - approach_notes
  - scalar_runs
  - arpeggiated_lines
  - digital_patterns
phrase_length_beats: [2.0, 16.0]
typical_scales:
  - bebop_major
  - bebop_dominant
  - altered
  - melodic_minor
  - diminished_whole_half
  - lydian_dominant
  - dorian
call_response_density: 0.3
melodic_contour_weights:
  ascending: 0.25
  descending: 0.25
  arch: 0.25
  valley: 0.15
  flat: 0.1
leap_probability: 0.35
blue_note_probability: 0.15

voicing_density_target: 4
bass_motion_style: walking
typical_dynamics_range: ["mp", "ff"]
target_spectral_centroid: 0.5

target_lufs: -16.0
target_peak_db: -1.0
typical_effects:
  - room_reverb_small
  - gentle_compression
stereo_imaging: narrow
production_profile_id: jazz_intimate

cliches_to_avoid:
  - "Running eighth notes without rhythmic variety or accents"
  - "Always starting phrases on the downbeat"
  - "Using bebop scales mechanically without melodic intent"
  - "Ignoring the harmonic rhythm in favor of scalar patterns"
  - "Same enclosure pattern repeated without variation"
