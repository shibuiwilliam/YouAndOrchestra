name: modal_jazz
parent: jazz
description: |
  Modal jazz: harmony built on modes rather than functional chord
  progressions. Sustained pedal tones, slow harmonic rhythm,
  exploration of scale colors over few chords.
  Miles Davis (Kind of Blue), John Coltrane, McCoy Tyner lineage.
  Prioritizes melodic exploration within modes over chord changes.

typical_tempo_range: [70, 180]
typical_keys: ["D", "C", "F", "Bb", "Eb", "G"]
typical_modes: ["dorian", "mixolydian", "lydian", "aeolian", "phrygian"]
typical_time_signatures: ["4/4", "3/4"]
typical_form_templates: ["aaba_32", "modal_vamp", "through_composed"]
typical_duration_seconds: [240, 480]

core_instruments:
  - name: upright_bass
    role: bass
  - name: drums_jazz_kit
    role: rhythm
  - name: piano_acoustic
    role: harmony
optional_instruments:
  - name: tenor_sax
    role: melody
  - name: trumpet
    role: melody
  - name: soprano_sax
    role: melody
  - name: jazz_guitar_clean
    role: harmony
  - name: vibraphone
    role: melody
  - name: flute
    role: melody
forbidden_instruments:
  - distorted_electric_guitar
  - synth_lead_saw
  - synth_bass
  - drums_808

chord_palette_extended:
  - min7
  - maj7
  - dom7
  - sus4
  - sus2
  - m11
  - "7sus4"
  - "6/9"
  - quartal
progression_library_ids:
  - modal_so_what
  - modal_two_chord_vamp
  - modal_pedal_tone
  - modal_coltrane_changes
harmonic_rhythm: [2.0, 8.0]
modal_interchange_allowed: true
chromaticism_level: 0.3
seventh_chord_probability: 0.8
secondary_dominant_probability: 0.1
modal_interchange_probability: 0.35

swing_8th: 0.62
swing_16th: 0.5
typical_grooves:
  - jazz_swing_medium
  - jazz_swing_slow
  - modal_free_pulse
drum_kit_preference: jazz_kit
drum_pattern_ids:
  - jazz_ride_swing
  - jazz_brushes
  - modal_open_ride
syncopation_density: 0.35
polyrhythm_tolerance: 0.4

melodic_devices:
  - modal_exploration
  - scalar_runs
  - quartal_voicings
  - pentatonic_patterns
  - intervallic_leaps
  - long_tones
phrase_length_beats: [4.0, 24.0]
typical_scales:
  - dorian
  - mixolydian
  - lydian
  - aeolian
  - phrygian
  - pentatonic_minor
  - pentatonic_major
call_response_density: 0.3
melodic_contour_weights:
  ascending: 0.2
  descending: 0.2
  arch: 0.25
  valley: 0.15
  flat: 0.2
leap_probability: 0.3
blue_note_probability: 0.1

voicing_density_target: 4
bass_motion_style: pedal
typical_dynamics_range: ["pp", "f"]
target_spectral_centroid: 0.42

target_lufs: -18.0
target_peak_db: -1.5
typical_effects:
  - room_reverb_small
  - gentle_compression
  - warm_eq
stereo_imaging: narrow
production_profile_id: jazz_intimate

cliches_to_avoid:
  - "Playing the mode as a scale exercise rather than creating melodies"
  - "Ignoring the unique color tones of each mode"
  - "Quartal voicings used mechanically without voice leading"
  - "Treating slow harmonic rhythm as an excuse for aimless noodling"
  - "Not exploiting the tension between modes when changes occur"
