# Chord Progression Library
# =========================
# Idiomatic chord progressions organized by genre, using Roman numeral notation.
# Based on IMPROVEMENT.md §4.3 Extended Harmony System.
#
# Each progression specifies:
#   id:            unique identifier (genre_prefix + descriptive slug)
#   name:          human-readable name
#   chords:        list of Roman numeral chord symbols
#   genre_tags:    list of applicable genres
#   cadence_type:  authentic | half | deceptive | plagal | none
#   description:   brief music-theoretical explanation

