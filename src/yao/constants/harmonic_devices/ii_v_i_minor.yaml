name: "ii_v_i_minor"
description: "Minor-key cadential progression where the supertonic is half-diminished (ii half-dim 7) and the dominant retains its major quality (V7) to provide the leading tone. The raised seventh degree in V7 creates the characteristic tension-to-minor-resolution sound."
