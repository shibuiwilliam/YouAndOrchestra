name: "turnaround_jazz"
description: "Classic jazz turnaround cycling through I-VI7-ii-V to reset harmonic momentum at section boundaries. The VI7 acts as a secondary dominant targeting ii, creating a chain of dominant resolution that propels back to the top of the form."
chord_pattern: ["I", "VI7", "ii", "V7"]
placement: "section_end"
genres: [jazz_ballad, bebop, cool_jazz, hard_bop, swing]
source: "Standard jazz harmonic convention — documented in Mark Levine, The Jazz Theory Book (1995)"
