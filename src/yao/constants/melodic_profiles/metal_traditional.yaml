genre: metal_traditional
description: >
  Traditional heavy metal (1970s–80s); powerful, aggressive, virtuosic.
  Characterized by minor-key tonality, power chord riffs, galloping
  rhythms, wide-ranging vocal melodies with operatic tendencies, and
  fast alternate-picked passages. Harmonic minor and Phrygian inflections
  are common alongside natural minor and pentatonic foundations.

scale_preferences:
  natural_minor: 0.30
  harmonic_minor: 0.20
  pentatonic_minor: 0.15
  phrygian: 0.15
  blues: 0.10
  chromatic: 0.10

interval_distribution:
  distribution:
    0: 0.05
    1: 0.12
    2: 0.18
    3: 0.18
    4: 0.10
    5: 0.10
    7: 0.12
    8: 0.05
    12: 0.10

chord_tone_targeting: 0.60
chromaticism_level: 0.35
syncopation_level: 0.25

phrase_length_distribution:
  distribution:
    2: 0.15
    4: 0.40
    8: 0.35
    16: 0.10

cadence_patterns:
  - name: "minor_authentic"
    chord_sequence: ["V", "i"]
    melodic_target: "1"
  - name: "phrygian_cadence"
    chord_sequence: ["bII", "i"]
    melodic_target: "1"
  - name: "power_riff_cadence"
    chord_sequence: ["bVII", "bVI", "i"]
    melodic_target: "1"
  - name: "harmonic_minor_cadence"
    chord_sequence: ["V7", "i"]
    melodic_target: "1"

rhythm_templates:
  - name: "gallop"
    pattern: [0.0, 0.25, 0.5, 1.0, 1.25, 1.5, 2.0, 2.25, 2.5, 3.0, 3.25, 3.5]
    durations: [0.25, 0.25, 0.5, 0.25, 0.25, 0.5, 0.25, 0.25, 0.5, 0.25, 0.25, 0.5]
    swing_ratio: 0.5
    syncopation_level: 0.2
  - name: "power_8ths"
    pattern: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
    durations: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    swing_ratio: 0.5
    syncopation_level: 0.1
  - name: "thrash_16ths"
    pattern: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75]
    durations: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    swing_ratio: 0.5
    syncopation_level: 0.15

ornament_profile:
  grace_note_probability: 0.05
  trill_probability: 0.08
  bend_probability: 0.20
  slide_probability: 0.15
  ghost_note_probability: 0.03
  legato_ratio: 0.35
  staccato_ratio: 0.15
  accent_ratio: 0.30

typical_ranges:
  melody: ["E2", "B5"]

motif_length_bars: 2.0
motif_recurrence_rate: 0.60
motif_transformations:
  identity: 0.30
  transposed: 0.25
  sequential: 0.15
  fragmented: 0.15
  inverted: 0.05
  augmented: 0.10

groove_profile_name: "straight"

anti_patterns:
  - name: "swing_feel"
    description: "Metal uses straight rhythms, never swing"
    severity: "critical"
    fix_suggestion: "Set swing_ratio to 0.5"
  - name: "major_key_dominance"
    description: "Traditional metal is predominantly minor-key"
    severity: "major"
    fix_suggestion: "Use natural minor, harmonic minor, or Phrygian as primary scale"
  - name: "weak_dynamics"
    description: "Metal requires high energy and strong attack"
    severity: "major"
    fix_suggestion: "Use forte to fortissimo dynamics with strong accent_ratio"
  - name: "no_riff"
    description: "Metal is riff-driven; pieces need a recognizable main riff"
    severity: "critical"
    fix_suggestion: "Ensure motif_recurrence_rate >= 0.5 with a clear rhythmic riff pattern"
