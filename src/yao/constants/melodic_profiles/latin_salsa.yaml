genre: latin_salsa
description: >
  Salsa (1960s–present); energetic, rhythmically complex, Afro-Cuban rooted.
  Characterized by clave-based rhythm, call-and-response melodic structure,
  syncopated brass and piano montunos, strong use of major and Mixolydian
  tonality, and high-energy vocal delivery. The clave pattern (son or rumba)
  is the rhythmic foundation for all melodic and harmonic activity.

scale_preferences:
  major: 0.35
  mixolydian: 0.25
  natural_minor: 0.15
  dorian: 0.10
  harmonic_minor: 0.10
  pentatonic_major: 0.05

interval_distribution:
  distribution:
    0: 0.08
    1: 0.05
    2: 0.22
    3: 0.20
    4: 0.12
    5: 0.12
    7: 0.10
    12: 0.11

chord_tone_targeting: 0.65
chromaticism_level: 0.15
syncopation_level: 0.75

phrase_length_distribution:
  distribution:
    2: 0.25
    4: 0.45
    8: 0.25
    16: 0.05

cadence_patterns:
  - name: "son_montuno_cadence"
    chord_sequence: ["V7", "I"]
    melodic_target: "1"
  - name: "salsa_vamp"
    chord_sequence: ["I", "IV", "V", "I"]
    melodic_target: "1"
  - name: "minor_salsa"
    chord_sequence: ["V7", "i"]
    melodic_target: "1"
  - name: "coro_pregon"
    chord_sequence: ["I", "V7"]
    melodic_target: "5"

rhythm_templates:
  - name: "son_clave_3_2"
    pattern: [0.0, 0.75, 1.5, 2.5, 3.25]
    durations: [0.75, 0.75, 1.0, 0.75, 0.75]
    swing_ratio: 0.5
    syncopation_level: 0.8
  - name: "montuno_pattern"
    pattern: [0.0, 0.25, 0.75, 1.0, 1.5, 2.0, 2.25, 2.75, 3.0, 3.5]
    durations: [0.25, 0.5, 0.25, 0.5, 0.5, 0.25, 0.5, 0.25, 0.5, 0.5]
    swing_ratio: 0.5
    syncopation_level: 0.75
  - name: "tumbao_bass"
    pattern: [0.0, 0.5, 1.5, 2.5, 3.0]
    durations: [0.5, 1.0, 1.0, 0.5, 1.0]
    swing_ratio: 0.5
    syncopation_level: 0.7

ornament_profile:
  grace_note_probability: 0.10
  trill_probability: 0.03
  bend_probability: 0.05
  slide_probability: 0.08
  ghost_note_probability: 0.10
  legato_ratio: 0.45
  staccato_ratio: 0.15
  accent_ratio: 0.25

typical_ranges:
  melody: ["C4", "C6"]

motif_length_bars: 2.0
motif_recurrence_rate: 0.65
motif_transformations:
  identity: 0.40
  transposed: 0.25
  sequential: 0.15
  fragmented: 0.10
  inverted: 0.05
  augmented: 0.05

groove_profile_name: "clave_son"

anti_patterns:
  - name: "no_clave"
    description: "Salsa must be organized around a clave pattern"
    severity: "critical"
    fix_suggestion: "Ensure all rhythmic patterns align with son or rumba clave"
  - name: "straight_8ths"
    description: "Salsa rhythm requires heavy syncopation, not straight subdivision"
    severity: "critical"
    fix_suggestion: "Use clave-aligned syncopated patterns with syncopation_level >= 0.6"
  - name: "no_call_response"
    description: "Salsa relies on call-and-response (pregon y coro)"
    severity: "major"
    fix_suggestion: "Structure vocal sections with alternating solo and chorus phrases"
  - name: "too_slow"
    description: "Salsa tempo is typically 160-220 BPM"
    severity: "major"
    fix_suggestion: "Set tempo_bpm between 160 and 220"
