genre: celtic
description: >
  Celtic music (Irish, Scottish traditional); lively, ornamented, modal.
  Characterized by dance-oriented jigs and reels in compound and simple
  meters, Mixolydian and Dorian modal flavors, pentatonic foundations,
  ornamental grace notes (cuts, strikes, rolls), stepwise motion with
  leaps at phrase boundaries, and AABB binary tune structures.

scale_preferences:
  mixolydian: 0.25
  dorian: 0.25
  major: 0.20
  pentatonic_major: 0.15
  aeolian: 0.10
  pentatonic_minor: 0.05

interval_distribution:
  distribution:
    0: 0.05
    1: 0.05
    2: 0.30
    3: 0.22
    4: 0.08
    5: 0.12
    7: 0.10
    12: 0.08

chord_tone_targeting: 0.65
chromaticism_level: 0.05
syncopation_level: 0.30

phrase_length_distribution:
  distribution:
    4: 0.40
    8: 0.50
    16: 0.10

cadence_patterns:
  - name: "modal_mixolydian"
    chord_sequence: ["bVII", "I"]
    melodic_target: "1"
  - name: "dorian_cadence"
    chord_sequence: ["IV", "i"]
    melodic_target: "1"
  - name: "authentic"
    chord_sequence: ["V", "I"]
    melodic_target: "1"
  - name: "double_tonic"
    chord_sequence: ["I", "bVII", "I"]
    melodic_target: "1"

rhythm_templates:
  - name: "reel_8ths"
    pattern: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75]
    durations: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
    swing_ratio: 0.5
    syncopation_level: 0.2
  - name: "jig_6_8"
    pattern: [0.0, 0.33, 0.67, 1.0, 1.33, 1.67]
    durations: [0.33, 0.33, 0.33, 0.33, 0.33, 0.33]
    swing_ratio: 0.5
    syncopation_level: 0.15
  - name: "slip_jig_9_8"
    pattern: [0.0, 0.33, 0.67, 1.0, 1.33, 1.67, 2.0, 2.33, 2.67]
    durations: [0.33, 0.33, 0.33, 0.33, 0.33, 0.33, 0.33, 0.33, 0.33]
    swing_ratio: 0.5
    syncopation_level: 0.1

ornament_profile:
  grace_note_probability: 0.30
  trill_probability: 0.10
  bend_probability: 0.0
  slide_probability: 0.05
  ghost_note_probability: 0.02
  legato_ratio: 0.55
  staccato_ratio: 0.10
  accent_ratio: 0.15

typical_ranges:
  melody: ["D4", "D6"]

motif_length_bars: 2.0
motif_recurrence_rate: 0.70
motif_transformations:
  identity: 0.35
  transposed: 0.25
  sequential: 0.20
  fragmented: 0.10
  inverted: 0.05
  augmented: 0.05

groove_profile_name: "celtic_dance"

anti_patterns:
  - name: "too_chromatic"
    description: "Celtic melodies are modal and diatonic, rarely chromatic"
    severity: "critical"
    fix_suggestion: "Reduce chromaticism_level below 0.10"
  - name: "no_ornamentation"
    description: "Celtic music requires characteristic ornaments (cuts, rolls, crans)"
    severity: "major"
    fix_suggestion: "Set grace_note_probability to at least 0.20"
  - name: "swing_feel"
    description: "Celtic reels and jigs use straight subdivision"
    severity: "major"
    fix_suggestion: "Set swing_ratio to 0.5"
  - name: "no_repeat_structure"
    description: "Celtic tunes follow AABB (or AABBA) structure"
    severity: "major"
    fix_suggestion: "Use binary repeated section form with high motif recurrence"
