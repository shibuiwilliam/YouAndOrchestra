metadata:
  name: "impressionist_bigram"
  description: "Bigram pitch transition probabilities for impressionist melody. Whole-tone emphasis creates modal ambiguity. Wide leaps (3rds, 4ths, tritones) are welcomed alongside stepwise motion. Avoids strong dominant-tonic resolution. Self-repetition is low — melodies wander."
  source: "Hand-derived from impressionist melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to diatonic (or whole-tone-influenced) steps. Impressionist
# melodies distribute motion more evenly across intervals. Whole-step motion
# (±2 degrees) is as common as half-step. Leaps of 3rds and 4ths are frequent.
# Leading-tone→tonic is deliberately weakened.
transitions:
  0: {0: 0.04, 1: 0.15, 2: 0.22, 3: 0.18, 4: 0.18, 5: 0.13, 6: 0.10}
  1: {0: 0.15, 1: 0.04, 2: 0.18, 3: 0.20, 4: 0.15, 5: 0.15, 6: 0.13}
  2: {0: 0.14, 1: 0.14, 2: 0.04, 3: 0.18, 4: 0.20, 5: 0.16, 6: 0.14}
  3: {0: 0.15, 1: 0.14, 2: 0.16, 3: 0.04, 4: 0.18, 5: 0.20, 6: 0.13}
  4: {0: 0.18, 1: 0.13, 2: 0.15, 3: 0.15, 4: 0.04, 5: 0.18, 6: 0.17}
  5: {0: 0.13, 1: 0.15, 2: 0.16, 3: 0.18, 4: 0.15, 5: 0.04, 6: 0.19}
  6: {0: 0.18, 1: 0.15, 2: 0.14, 3: 0.14, 4: 0.17, 5: 0.18, 6: 0.04}
