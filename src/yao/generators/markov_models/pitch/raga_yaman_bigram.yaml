metadata:
  name: "raga_yaman_bigram"
  description: "Bigram pitch transition probabilities for Raga Yaman (Kalyan thaat). Ascending phrases emphasize tivra Ma (sharp 4th = degree 3) and Pa (5th = degree 4). Descending phrases favor Ni-Dha-Pa motion. Sa (degree 0) is avoided in ascending approach — must be reached via Ni (degree 6)."
  source: "Hand-derived from Raga Yaman melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to: Sa(0), Re(1), Ga(2), Ma#(3), Pa(4), Dha(5), Ni(6).
# Yaman rules: ascending avoids Sa after Ni (prefer Re), tivra Ma is pivotal
# leading to Pa, descending Ni→Dha→Pa is characteristic.
transitions:
  0: {0: 0.05, 1: 0.30, 2: 0.15, 3: 0.12, 4: 0.18, 5: 0.10, 6: 0.10}
  1: {0: 0.12, 1: 0.05, 2: 0.32, 3: 0.20, 4: 0.12, 5: 0.10, 6: 0.09}
  2: {0: 0.08, 1: 0.15, 2: 0.05, 3: 0.35, 4: 0.18, 5: 0.12, 6: 0.07}
  3: {0: 0.05, 1: 0.08, 2: 0.15, 3: 0.05, 4: 0.42, 5: 0.15, 6: 0.10}
  4: {0: 0.10, 1: 0.08, 2: 0.10, 3: 0.18, 4: 0.05, 5: 0.30, 6: 0.19}
  5: {0: 0.08, 1: 0.07, 2: 0.10, 3: 0.10, 4: 0.30, 5: 0.05, 6: 0.30}
  6: {0: 0.25, 1: 0.20, 2: 0.08, 3: 0.07, 4: 0.10, 5: 0.25, 6: 0.05}
