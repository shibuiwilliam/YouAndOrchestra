metadata:
  name: "celtic_modal_bigram"
  description: "Bigram pitch transition probabilities for Celtic/folk melody in dorian-centric modes. Predominantly stepwise with characteristic leaps of 4ths and 5ths. Pentatonic-like gaps (avoiding degree 6 in many phrases) and strong tonic/dominant axis."
  source: "Hand-derived from Celtic folk melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to dorian/mixolydian steps. Celtic melodies favor stepwise
# motion with 4th/5th leaps (0→3, 0→4, 4→0). Degree 6 is less frequent
# (pentatonic tendency). Strong tonic return.
transitions:
  0: {0: 0.05, 1: 0.25, 2: 0.10, 3: 0.20, 4: 0.25, 5: 0.10, 6: 0.05}
  1: {0: 0.30, 1: 0.05, 2: 0.30, 3: 0.12, 4: 0.10, 5: 0.08, 6: 0.05}
  2: {0: 0.15, 1: 0.25, 2: 0.05, 3: 0.25, 4: 0.15, 5: 0.10, 6: 0.05}
  3: {0: 0.18, 1: 0.10, 2: 0.22, 3: 0.05, 4: 0.28, 5: 0.12, 6: 0.05}
  4: {0: 0.30, 1: 0.10, 2: 0.12, 3: 0.18, 4: 0.05, 5: 0.18, 6: 0.07}
  5: {0: 0.12, 1: 0.10, 2: 0.10, 3: 0.15, 4: 0.28, 5: 0.05, 6: 0.20}
  6: {0: 0.28, 1: 0.12, 2: 0.08, 3: 0.10, 4: 0.15, 5: 0.20, 6: 0.07}
