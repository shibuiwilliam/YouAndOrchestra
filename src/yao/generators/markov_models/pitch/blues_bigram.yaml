metadata:
  name: "blues_bigram"
  description: "Bigram pitch transition probabilities for blues melody. Blue notes (b3=degree 2, b5=degree 4, b7=degree 5 in a blues-inflected diatonic mapping) receive higher transition weight. Emphasis on repeated notes and small intervals with gravity toward tonic."
  source: "Hand-derived from blues melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to diatonic steps. Blues weights degrees 2 (b3), 4 (b5),
# and 5 (b7) heavily. Strong tonic pull, high self-repetition on blue notes,
# descending motion favored.
transitions:
  0: {0: 0.10, 1: 0.12, 2: 0.28, 3: 0.08, 4: 0.15, 5: 0.20, 6: 0.07}
  1: {0: 0.25, 1: 0.05, 2: 0.35, 3: 0.08, 4: 0.12, 5: 0.10, 6: 0.05}
  2: {0: 0.22, 1: 0.15, 2: 0.10, 3: 0.18, 4: 0.20, 5: 0.10, 6: 0.05}
  3: {0: 0.10, 1: 0.08, 2: 0.30, 3: 0.05, 4: 0.25, 5: 0.15, 6: 0.07}
  4: {0: 0.12, 1: 0.05, 2: 0.22, 3: 0.18, 4: 0.08, 5: 0.28, 6: 0.07}
  5: {0: 0.20, 1: 0.05, 2: 0.18, 3: 0.10, 4: 0.22, 5: 0.10, 6: 0.15}
  6: {0: 0.35, 1: 0.08, 2: 0.15, 3: 0.07, 4: 0.10, 5: 0.18, 6: 0.07}
