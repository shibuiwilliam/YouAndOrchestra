metadata:
  name: "latin_bossa_bigram"
  description: "Bigram pitch transition probabilities for bossa nova melody. Smooth conjunct motion dominates with chromatic neighbor-tone approaches. Melodies tend to circle around a narrow range with gentle stepwise descent and subtle chromaticism."
  source: "Hand-derived from bossa nova melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to diatonic scale steps. Bossa nova favors smooth stepwise
# motion (±1 degree very high), repeated notes, and avoids large leaps.
# Melodic gravity gently descends. Extensions (degrees 1, 5) are common.
transitions:
  0: {0: 0.08, 1: 0.30, 2: 0.12, 3: 0.08, 4: 0.15, 5: 0.12, 6: 0.15}
  1: {0: 0.28, 1: 0.07, 2: 0.32, 3: 0.10, 4: 0.08, 5: 0.08, 6: 0.07}
  2: {0: 0.10, 1: 0.30, 2: 0.07, 3: 0.28, 4: 0.10, 5: 0.08, 6: 0.07}
  3: {0: 0.08, 1: 0.10, 2: 0.30, 3: 0.07, 4: 0.25, 5: 0.12, 6: 0.08}
  4: {0: 0.15, 1: 0.08, 2: 0.10, 3: 0.25, 4: 0.07, 5: 0.25, 6: 0.10}
  5: {0: 0.10, 1: 0.12, 2: 0.08, 3: 0.10, 4: 0.25, 5: 0.07, 6: 0.28}
  6: {0: 0.30, 1: 0.12, 2: 0.10, 3: 0.08, 4: 0.10, 5: 0.22, 6: 0.08}
