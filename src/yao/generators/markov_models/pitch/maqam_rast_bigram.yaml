metadata:
  name: "maqam_rast_bigram"
  description: "Bigram pitch transition probabilities for Maqam Rast. Emphasis on the tonic (degree 0), mediant (degree 2), and dominant (degree 4) as resting tones. Stepwise conjunct motion is primary. The characteristic Rast tetrachord (degrees 0-1-2-3) dominates melodic activity."
  source: "Hand-derived from Maqam Rast melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to Rast maqam steps. Rast emphasizes the lower jins
# (tetrachord 0-1-2-3) and the ghammaz (degree 4). Strong stepwise motion
# with tonic and dominant as gravitational centers.
transitions:
  0: {0: 0.08, 1: 0.32, 2: 0.15, 3: 0.10, 4: 0.20, 5: 0.08, 6: 0.07}
  1: {0: 0.30, 1: 0.05, 2: 0.35, 3: 0.10, 4: 0.08, 5: 0.07, 6: 0.05}
