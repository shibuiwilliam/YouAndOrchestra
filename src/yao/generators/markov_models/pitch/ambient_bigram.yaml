metadata:
  name: "ambient_bigram"
  description: "Bigram pitch transition probabilities for ambient/new age melody. Wide intervals (4ths, 5ths, 6ths) are as common as stepwise motion. High self-repetition on stable degrees creates drone-like quality. Minimal resolution tension — no strong leading-tone pull. Even distribution across degrees."
  source: "Hand-derived from ambient/new age melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to diatonic (often pentatonic-leaning) steps. Ambient
# melodies feature high self-repetition, wide leaps, no functional pull.
# The distribution is deliberately flatter than other genres.
transitions:
  0: {0: 0.15, 1: 0.12, 2: 0.13, 3: 0.12, 4: 0.20, 5: 0.15, 6: 0.13}
  1: {0: 0.15, 1: 0.12, 2: 0.15, 3: 0.15, 4: 0.13, 5: 0.15, 6: 0.15}
  2: {0: 0.15, 1: 0.13, 2: 0.12, 3: 0.15, 4: 0.18, 5: 0.14, 6: 0.13}
  3: {0: 0.14, 1: 0.13, 2: 0.15, 3: 0.12, 4: 0.15, 5: 0.18, 6: 0.13}
  4: {0: 0.20, 1: 0.12, 2: 0.14, 3: 0.13, 4: 0.13, 5: 0.15, 6: 0.13}
  5: {0: 0.15, 1: 0.14, 2: 0.13, 3: 0.15, 4: 0.15, 5: 0.13, 6: 0.15}
  6: {0: 0.15, 1: 0.15, 2: 0.13, 3: 0.13, 4: 0.15, 5: 0.15, 6: 0.14}
