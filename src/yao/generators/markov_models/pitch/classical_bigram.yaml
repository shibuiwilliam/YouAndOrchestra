metadata:
  name: "classical_bigram"
  description: "Bigram pitch transition probabilities for Classical period melody. Strong functional harmony drive: leading-tone resolves to tonic (degree 6→0), dominant axis (degree 4) is gravitational. Stepwise motion dominates with prepared leaps. Balanced ascending/descending contour."
  source: "Hand-derived from Classical period melodic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2

# Scale degree transitions: current_degree → {next_degree: probability}
# Degrees 0-6 map to diatonic scale steps (major). Classical period melodies
# have very strong leading-tone→tonic (6→0), dominant pull (4→0, 4→3),
# and balanced stepwise motion. Leaps are typically followed by step in
# opposite direction (not captured in bigram but weights reflect tendency).
