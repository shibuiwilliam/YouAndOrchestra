metadata:
  name: "afrobeat_poly"
  description: "Afrobeat polyrhythmic rhythm model. All beats active with near-equal weight, creating layered interlocking patterns. Slight emphasis on beats 0 and 2."
  source: "Hand-derived from afrobeat rhythmic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2
  resolution: beat

# State: beat position (0-3 in 4/4)
# Afrobeat: polyrhythmic, all beats active, near-uniform with slight 0/2 emphasis
transitions:
  0: {0: 0.10, 1: 0.30, 2: 0.30, 3: 0.30}
  1: {0: 0.30, 1: 0.10, 2: 0.35, 3: 0.25}
  2: {0: 0.30, 1: 0.25, 2: 0.10, 3: 0.35}
  3: {0: 0.35, 1: 0.25, 2: 0.30, 3: 0.10}
