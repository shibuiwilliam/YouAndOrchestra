metadata:
  name: "bebop_swing_8th"
  description: "Bebop swing 8ths rhythm model. Strong downbeat with on-off alternation characteristic of swing feel. Favors beats 0 and 2 with swung offbeats."
  source: "Hand-derived from bebop rhythmic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2
  resolution: beat

# State: beat position (0-3 in 4/4)
# Bebop swing: strong downbeat, alternating on-off pattern, beat 0 heavily favored
transitions:
  0: {0: 0.05, 1: 0.35, 2: 0.30, 3: 0.30}
  1: {0: 0.25, 1: 0.05, 2: 0.45, 3: 0.25}
  2: {0: 0.30, 1: 0.30, 2: 0.05, 3: 0.35}
  3: {0: 0.50, 1: 0.20, 2: 0.25, 3: 0.05}
