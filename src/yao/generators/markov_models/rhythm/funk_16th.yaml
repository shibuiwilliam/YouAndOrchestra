metadata:
  name: "funk_16th"
  description: "Funk 16th-note rhythm model. All positions active with syncopation emphasis on beats 1 and 3, creating the off-kilter groove characteristic of funk."
  source: "Hand-derived from funk rhythmic conventions (no copyrighted corpus)"
  license: "CC0 — original work by YaO project"
  n_gram_order: 2
  resolution: beat

# State: beat position (0-3 in 4/4)
# Funk 16th: all active, syncopation on 1 and 3, less predictable transitions
transitions:
  0: {0: 0.10, 1: 0.35, 2: 0.20, 3: 0.35}
  1: {0: 0.20, 1: 0.10, 2: 0.30, 3: 0.40}
  2: {0: 0.25, 1: 0.35, 2: 0.10, 3: 0.30}
  3: {0: 0.35, 1: 0.30, 2: 0.25, 3: 0.10}
