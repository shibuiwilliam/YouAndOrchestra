# Reggae one-drop pattern
# No kick on beat 1, kick+snare together on beat 3, cross-stick on 2 and 4, closed hat 8ths
id: reggae_one_drop
genre: reggae
time_signature: "4/4"
bars_per_pattern: 1
swing: 0.0
humanize_ms: 5

hits:
  # Beat 1 (empty kick - characteristic of one-drop)
  - { time_beats: 0.0, kit_piece: closed_hat, velocity: 75, duration_beats: 0.25 }
  - { time_beats: 0.5, kit_piece: closed_hat, velocity: 60, duration_beats: 0.25 }
  # Beat 2
  - { time_beats: 1.0, kit_piece: rim, velocity: 85, duration_beats: 0.25 }
  - { time_beats: 1.0, kit_piece: closed_hat, velocity: 75, duration_beats: 0.25 }
  - { time_beats: 1.5, kit_piece: closed_hat, velocity: 60, duration_beats: 0.25 }
  # Beat 3 (the "one drop" - kick and snare together)
  - { time_beats: 2.0, kit_piece: kick, velocity: 105, duration_beats: 0.25 }
  - { time_beats: 2.0, kit_piece: snare, velocity: 100, duration_beats: 0.25 }
  - { time_beats: 2.0, kit_piece: closed_hat, velocity: 75, duration_beats: 0.25 }
  - { time_beats: 2.5, kit_piece: closed_hat, velocity: 60, duration_beats: 0.25 }
  # Beat 4
  - { time_beats: 3.0, kit_piece: rim, velocity: 85, duration_beats: 0.25 }
  - { time_beats: 3.0, kit_piece: closed_hat, velocity: 75, duration_beats: 0.25 }
  - { time_beats: 3.5, kit_piece: closed_hat, velocity: 60, duration_beats: 0.25 }
